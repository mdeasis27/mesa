[project]
name = "mesa"
version = "0.1.0"
description = "Multi-agent orchestration with typed handoffs, budget enforcement and step tracing"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
